name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" lint
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -r --filter "./packages/*" test

      # The example is the deployable demo, so a broken build is a broken demo.
      - name: build the example
        run: pnpm --filter helpdeck-example-nextjs build
