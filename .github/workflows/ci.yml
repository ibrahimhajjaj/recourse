name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # The plugin's own suite, which the Node job cannot run: it skips both phpunit
  # and phpcs when `composer install` has not happened, and did so silently on
  # every push. That left the parity tests off, and those are the ones holding
  # the two tokenisers to the same output. A change to the TypeScript one could
  # break the PHP one and still go green.
  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Both ends of what the plugin claims to support. The floor is the one
      # that matters: it ships to sites nobody upgrades, and the coding standard
      # only checks the floor statically, which does not catch behaviour.
      matrix:
        php: ['7.4', '8.3']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Neither is optional here, for the same reason: without them the
          # tokeniser quietly does less. mbstring is what makes string handling
          # character-wise rather than byte-wise, and intl is what composes
          # accents. The plugin runs without intl on purpose, since plenty of
          # shared hosts lack it, but the parity suite skips itself when it is
          # missing, so a run without it checks less than it appears to.
          extensions: mbstring, intl
          coverage: none
          tools: composer

      - name: composer cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('packages/wordpress/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: packages/wordpress

      # The standard a wp.org reviewer applies, plus the 7.4 floor check.
      - run: vendor/bin/phpcs --standard=.phpcs.xml.dist includes tests
        working-directory: packages/wordpress

      - run: vendor/bin/phpunit
        working-directory: packages/wordpress

  test:
    runs-on: ubuntu-latest

    services:
      # The Postgres store's suite skips without this and runs against it when
      # present, so the database implementation is covered on every push
      # instead of only when somebody remembers to start one.
      postgres:
        # pgvector's own image, which is the stock Postgres one with the
        # extension already there. On plain postgres:16 the vector suite fails
        # on `CREATE EXTENSION vector` rather than skipping, so the adapter's
        # similarity search went uncovered while the job looked like it ran.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: recourse
          POSTGRES_DB: recourse
          # Both halves, because initdb warns unless each is set and the warning
          # names only the local one. It also stops the container trusting
          # whoever reaches its socket, which is the better default anyway.
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        # Named, because bare `pg_isready` connects as the runner's own user and
        # the server logs a FATAL for a role that does not exist every ten
        # seconds. It exits zero anyway, so the job went green on a check that
        # only proved the port was open rather than that the test database was.
        options: >-
          --health-cmd "pg_isready -U postgres -d recourse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:recourse@localhost:5432/recourse

    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. The action refuses to start when it is
      # given one and package.json also has `packageManager`, and the one in
      # package.json is the version that has to win: it is what everybody's
      # local pnpm honours, so pinning a second one here is how CI and a
      # developer's machine quietly end up on different resolvers.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first, which is the order `pnpm verify` uses and the order the
      # packages actually depend on. The store adapters lint by typechecking
      # against core's generated declarations, so linting a fresh checkout
      # before building it reports a hundred phantom `any` errors from a
      # `dist` that does not exist yet. It passed on a developer's machine
      # only because theirs was already built.
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -r --filter "./packages/*" lint
      - run: pnpm -r --filter "./packages/*" test

      # Retrieval quality, asserted rather than assumed. Deterministic, needs no
      # model and no credential, and catches a threshold or stemmer change
      # silently undoing the last one. The suites that need a model are run by
      # hand, because CI has no GPU and a hosted one would cost money per push.
      - name: retrieval evals
        run: pnpm --filter @recourse-ai/evals eval -- --suite retrieval

      # The examples are what people copy, so a broken one is a broken first
      # impression. Nothing typechecked them until now, and all three bugs that
      # found were in the example a reader would paste: a type imported from an
      # entry that did not export it, a required option passed conditionally,
      # and a rate limit spelled wrongly enough to be ignored entirely.
      # The parity fixtures are generated from the TypeScript side and compared
      # against the PHP one. Nothing regenerated them, so they only ever changed
      # when somebody did it by hand, and a committed fixture that predates a
      # change to the TypeScript retriever compares PHP against expectations
      # neither side produces any more. That is not a weak check, it is a check
      # that has stopped running while still going green: the synonym layer
      # broke retrieval parity and three commits went by before it showed.
      - name: the parity fixtures are current
        run: |
          pnpm --filter @recourse-ai/wordpress fixtures
          git diff --exit-code --stat packages/wordpress/tests/fixtures/parity.json \
            || (echo "::error::parity fixtures are stale; run 'pnpm --filter @recourse-ai/wordpress fixtures' and commit the result" && exit 1)

      - name: typecheck the examples
        run: pnpm -r --filter "./examples/*" lint

      # Fails if anything Node-only reaches the serving path. A test cannot
      # catch that; only a bundle can.
      - name: worker bundle guard
        run: pnpm --filter recourse-example-worker check

      # The example is the deployable demo, so a broken build is a broken demo.
      - name: build the example
        run: pnpm --filter recourse-example-nextjs build
